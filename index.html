<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>GIN SUSHI | Ristorante Giapponese</title>

  <style>
    :root {
      --gold: #a38f5a;
      --bg-dark: #0b0b0b;
      --text-light: #eaeaea;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      padding: 0;
      font-family: "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-light);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 500px;
      padding: 40px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* LOGO SECTION */
    .logo-container {
      margin-bottom: 50px;
      text-align: center;
      width: 100%;
    }

    .logo-container img {
      max-width: 280px;
      width: 80%;
      height: auto;
    }

    .logo-fallback {
      font-size: 2.2rem;
      color: var(--gold);
      letter-spacing: 5px;
      text-transform: uppercase;
      font-weight: bold;
    }

    /* BUTTONS SECTION */
    .menu-buttons {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
    }

    .menu-buttons a {
      display: block; 
      text-decoration: none;
      border: 1.5px solid var(--gold);
      color: var(--gold);
      padding: 24px 15px;
      text-align: center;
      font-size: 1rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: all 0.2s ease;
    }

    .menu-buttons a:active {
      background: var(--gold);
      color: #000;
    }

    /* FOOTER INFO */
    footer {
      margin-top: 60px;
      text-align: center;
      font-size: 0.85rem;
      color: #888;
      letter-spacing: 1px;
      line-height: 2;
    }

    footer a {
      color: #888;
      text-decoration: none;
      display: block;
    }

    /* WhatsApp */
    .whatsapp-btn {
      position: fixed;
      bottom: 25px;
      right: 25px;
      background: #25d366;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 5px 15px rgba(0,0,0,0.6);
      z-index: 999;
    }
  </style>
</head>

<body>

  <div class="container">
    
    <div class="logo-container">
      <img src="logo.png" alt="GIN SUSHI" onerror="this.style.display='none'; document.getElementById('alt-logo').style.display='block';">
      <div id="alt-logo" class="logo-fallback" style="display:none;">GIN SUSHI</div>
    </div>

    <nav class="menu-buttons">
      <a href="https://drive.google.com/file/d/1Abl6yNF0RwNCGXbcHVZFg-OiOOR6KBct/view?usp=sharing" target="_blank">
        MENU PRANZO

      <a href="https://drive.google.com/file/d/17N6rUHHbHvqiH8kgtE6DpTCTmE68rGat/view?usp=drive_link" target="_blank">
        MENU CENA
      </a>

      <a href="https://drive.google.com/file/d/1AVzTRZTyFNaX870EuSNRq7KLSzth0ld6/view?usp=drive_link" target="_blank">
        MENU À LA CARTE
      </a>

      <a href="https://drive.google.com/file/d/1cgmCD06lbH0Oe4zD0Yeb1H9QhYJh6G5d/view?usp=drive_link" target="_blank">
        MENU TAKE AWAY
      </a>
    </nav>

    <footer>
      <a href="https://www.google.com/maps/search/?api=1&query=Via+Daniele+Manin+40+Oderzo" target="_blank">
        Via Daniele Manin 40, Oderzo
      </a>
      <a href="tel:0422207511">Tel: 0422 1562516</a>
      <div style="margin-top: 15px; opacity: 0.4; font-size: 0.7rem;">© 2026 GIN SUSHI</div>
    </footer>

  </div>
